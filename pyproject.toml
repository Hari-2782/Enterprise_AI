[project]
name = "enterprise-ai-backend"
version = "0.1.0"
description = "Enterprise AI Intelligence Platform backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.33",
    "python-json-logger==4.2.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "azure-search-documents==12.1.0",
    "pymupdf==2.1",
    "python-docx==1.2.0",
    "transformers==4.57.3",
    "sentencepiece==0.2.3",
    "torch>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
