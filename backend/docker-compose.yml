services:
  postgres:
    image: postgres:16
    container_name: enterprise-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enterprise_app
      POSTGRES_PASSWORD: local_dev_only_change
      POSTGRES_DB: enterprise_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: